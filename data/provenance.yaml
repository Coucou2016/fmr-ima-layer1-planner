    \      optional: n_particles_la, n_particles_aorta\n\nCardiac phase MUST be explicit.\
    \ Rows with cardiac_phase containing\n'undformed'/'diastole' are stored separately\
    \ and never merged into\npeak-systole ROA/leakage features without the phase tag."
